[build]
builder = "nixpacks"
buildCommand = "cd apps/dashboard && npm install && npm run build && cd ../.."

[deploy]
startCommand = "node --experimental-sqlite --experimental-strip-types src/api-server.ts"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environment]
NODE_ENV = "production"
PORT = "3000"
DATA_DIR = "/data"
