<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PLUTO — Company OS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hedvig+Letters+Serif&display=swap');
    :root {
      --bg: #f2ede1; --panel: #faf7ee; --panel2: #eee8da; --panel3: #e5ddca;
      --line: #d9cfbb; --line-soft: rgba(22, 19, 15, 0.08);
      --text: #1a1712; --dim: #6f675a; --faint: #8f8674;
      --accent: #d95f33; --accent-soft: #e8643c; --teal: #2f7f74;
      --good: #5f7d33; --warn: #a17828; --bad: #c03a2d;
      --mono: 'SF Mono', ui-monospace, 'Cascadia Code', Menlo, monospace;
      --display: 'Hedvig Letters Serif', Georgia, serif;
      --agent-1a: #f7cfdc; --agent-1b: #1f7a3a; --agent-2a: #c9a9e8; --agent-2b: #ee79a1;
      --agent-3a: #28164b; --agent-3b: #7a1530; --agent-4a: #f3e6c4; --agent-4b: #e3a21a;
      --agent-5a: #1f4dd6; --agent-5b: #3aa35c; --agent-6a: #e94b27; --agent-6b: #5a1122;
      --agent-7a: #7eb6e3; --agent-7b: #ee79a1; --agent-8a: #9ce8a7; --agent-8b: #bd7ff0;
      --agent-9a: #f3b49e; --agent-9b: #1f4ed4; --agent-10a: #f2d95f; --agent-10b: #4fbcba;
      --status-idle: #8f8674; --status-running: #2f7f74; --status-todo: #a17828;
      --status-review: #a05b8f; --status-done: #5f7d33; --status-error: #c03a2d;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, -apple-system, sans-serif; overflow: hidden; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #d0c6ae; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #c0b498; }
    ::-webkit-scrollbar-track { background: transparent; }

    header {
      display: flex; align-items: center; gap: 14px; padding: 12px 18px;
      border-bottom: 1px solid var(--line); background: rgba(242, 237, 225, 0.96);
      position: sticky; top: 0; z-index: 5; height: 54px;
    }
    header .logo { font-family: var(--display); font-weight: 500; letter-spacing: 3px; color: var(--text); font-size: 17px; white-space: nowrap; }
    header .logo .dot { color: var(--accent); }
    #company-label { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
    #health { font-family: var(--mono); font-size: 11px; color: var(--dim); border: 1px solid var(--line); background: var(--panel); padding: 3px 10px; border-radius: 99px; white-space: nowrap; }
    #live { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); display: inline-block; flex: 0 0 auto; }
    #live.on { background: var(--good); box-shadow: 0 0 6px color-mix(in srgb, var(--good) 60%, transparent); }
    #company-select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 13px; font-weight: 600; outline: none; max-width: 220px; }
    #company-select:focus { border-color: var(--accent); }
    #toggle-props { flex: 0 0 auto; background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
    #toggle-props:hover { color: var(--text); border-color: var(--faint); }
    #toggle-props.off { opacity: 0.6; }
    #new-company { flex: 0 0 auto; }
    #toggle-chat { flex: 0 0 auto; background: var(--panel); color: var(--dim); border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; font-family: inherit; }
    #toggle-chat:hover { color: var(--text); border-color: var(--faint); }
    #toggle-chat.on { color: var(--accent); border-color: var(--accent); }
    .spacer { flex: 1; }
    #new-task { display: flex; align-items: center; gap: 10px; width: 100%; padding: 9px 12px; border-radius: 9px; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; margin-bottom: 8px; }
    #new-task:hover { background: color-mix(in srgb, var(--accent) 18%, transparent); }
    #new-task .ic { width: 18px; text-align: center; color: var(--accent); }
    #new-task .kbd { margin-left: auto; font-family: var(--mono); font-size: 9px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
    #chat { position: fixed; top: 54px; right: 0; bottom: 0; width: 360px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; z-index: 15; transition: transform .25s ease; box-shadow: -12px 0 30px rgba(0,0,0,.25); }
    #chat.closed { transform: translateX(100%); box-shadow: none; }
    #chat .chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    #chat .chat-head h3 { margin: 0; font-size: 13px; }
    #chat .chat-head .sub { font-size: 10px; }
    #chat .chat-head #chat-close { margin-left: auto; background: transparent; border: none; color: var(--dim); font-size: 18px; cursor: pointer; font-family: inherit; }
    #chat .chat-head #chat-close:hover { color: var(--text); }
    #chat-body { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 10px; }
    #chat-body .msg { max-width: 86%; padding: 8px 12px; border-radius: 12px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    #chat-body .msg.u { align-self: flex-end; background: color-mix(in srgb, var(--accent) 16%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); color: var(--text); border-bottom-right-radius: 3px; }
    #chat-body .msg.c { align-self: flex-start; background: var(--panel2); border: 1px solid var(--line); color: var(--dim); border-bottom-left-radius: 3px; }
    #chat-body .msg.c.ok { color: var(--text); }
    #chat .chat-input { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
    #chat .chat-input input { flex: 1; }
    #cmdbar .cmd-card { width: 440px; max-width: calc(100vw - 40px); }
    #cmdbar .cmd-card select { color-scheme: dark; }

    #shell { display: grid; grid-template-columns: 228px 1fr 288px; height: calc(100vh - 54px); }
    #shell.no-props { grid-template-columns: 228px 1fr; }

    #sidebar { background: var(--panel); border-right: 1px solid var(--line); padding: 14px 10px 16px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
    #nav { display: flex; flex-direction: column; gap: 2px; }
    #nav .nav-sec { display: flex; flex-direction: column; gap: 2px; }
    #nav .nav-cat { display: flex; align-items: center; justify-content: space-between; font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--faint); padding: 14px 12px 4px; cursor: pointer; user-select: none; }
    #nav .nav-cat:hover { color: var(--dim); }
    #nav .nav-cat .caret { font-size: 9px; opacity: 0.7; }
    #nav .nav-sec.collapsed .nav-cat .caret { transform: rotate(-90deg); }
    #nav .nav-sec.collapsed .nav-item { display: none; }
    #nav button { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 9px 12px; border-radius: 9px; background: transparent; border: 1px solid transparent; color: var(--dim); font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; }
    #nav button:hover { background: var(--panel2); color: var(--text); }
    #nav button.active { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--text); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
    #nav button .ic { width: 18px; text-align: center; font-size: 12.5px; color: var(--accent); opacity: 0.85; flex: 0 0 auto; }
    #nav button.active .ic { opacity: 1; }
    #sidebar .side-card { border: 1px solid var(--line); border-radius: 12px; background: var(--bg); padding: 12px; }
    #sidebar .side-card h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--faint); margin-bottom: 8px; }
    #sidebar .side-card h3 span { float: right; font-family: var(--mono); font-weight: 400; color: var(--dim); }
    #side-agents { display: flex; flex-direction: column; gap: 2px; }
    .agent-row { display: flex; align-items: center; gap: 9px; padding: 5px 4px; border-radius: 8px; }
    .agent-row:hover { background: var(--panel2); }
    .agent-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--text); }
    .agent-row .role { color: var(--faint); font-size: 10px; }
    .capsule { display: inline-block; width: 8px; height: 21px; border-radius: 99px; flex: 0 0 auto; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16); }
    .capsule.online { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.16), 0 0 7px 1px color-mix(in srgb, var(--status-done) 60%, transparent); }
    .capsule.paused { box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.14), 0 0 5px 1px color-mix(in srgb, var(--status-todo) 55%, transparent); }
    .capsule.capsule-sm { width: 7px; height: 18px; }

    #content { padding: 16px 22px 20px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
    #crumbs { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 8px; }
    #crumbs .sep { opacity: 0.5; }
    #crumbs b { color: var(--dim); font-weight: 500; }
    #crumbs .here { color: var(--text); font-weight: 600; }
    .metric-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 9px; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    #view-command h3, #overview-grid h3, #props h3 { font-family: var(--display); font-weight: 500; font-size: 19px; letter-spacing: 0.2px; color: var(--text); margin-bottom: 12px; }
    #view-command h3:not(:first-child) { margin-top: 18px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
    .kpi { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
    .kpi .v { font-size: 20px; font-weight: 700; font-family: var(--mono); color: var(--text); }
    .kpi .l { font-size: 10px; color: var(--faint); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.6px; }
    .kpi .v.good { color: var(--good); } .kpi .v.warn { color: var(--warn); } .kpi .v.bad { color: var(--bad); }
    #side-kpis #kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #side-kpis .kpi { padding: 8px 10px; border-radius: 10px; background: var(--panel); }
    #side-kpis .kpi .v { font-size: 15px; }
    #side-kpis .kpi .l { font-size: 9px; }
    table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
    th { text-align: left; color: var(--faint); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px; }
    td { padding: 7px 8px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
    tr:hover td { background: color-mix(in srgb, var(--accent) 4%, transparent); }
    .pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; border: 1px solid var(--line); background: var(--panel3); color: var(--dim); }
    .pill.ok { color: var(--good); border-color: color-mix(in srgb, var(--good) 38%, transparent); }
    .pill.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 38%, transparent); }
    .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 38%, transparent); }
    .pill.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 38%, transparent); }
    .pill.teal { color: var(--teal); border-color: color-mix(in srgb, var(--teal) 38%, transparent); }
    .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 4px; }
    .bar > div { height: 100%; background: var(--accent); border-radius: 3px; }
    .bar.good > div { background: var(--good); } .bar.warn > div { background: var(--warn); } .bar.bad > div { background: var(--bad); }
    .event { display: flex; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--line-soft); font-size: 12px; align-items: baseline; }
    .event .t { color: var(--faint); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
    .event .ty { color: var(--accent); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
    #content .empty { color: var(--faint); font-style: italic; padding: 14px; text-align: center; }
    .hidden { display: none !important; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
    #graph-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; padding: 12px; }
    svg { display: block; width: 100%; height: 460px; }
    svg .node circle { stroke: var(--line); stroke-width: 1.5; }
    svg .node text { fill: var(--faint); font-size: 10px; font-family: system-ui; }
    svg .edge { stroke: #cfc5ab; stroke-width: 1; opacity: 0.8; }
    #graph-legend { padding-top: 6px; }
    .mono { font-family: var(--mono); }
    .approval { border: 1px solid var(--line); border-left: 3px solid var(--warn); border-radius: 12px; padding: 11px 13px; margin-bottom: 8px; background: var(--panel2); }
    .approval .a { font-weight: 600; }
    .approval button { margin-top: 8px; margin-right: 8px; padding: 5px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; font-family: inherit; font-size: 12px; }
    .approval .ok { background: color-mix(in srgb, var(--good) 14%, transparent); border-color: var(--good); color: var(--good); }
    .approval .ok:hover { background: color-mix(in srgb, var(--good) 24%, transparent); }
    .approval .no { background: color-mix(in srgb, var(--bad) 14%, transparent); border-color: var(--bad); color: var(--bad); }
    .approval .no:hover { background: color-mix(in srgb, var(--bad) 24%, transparent); }
    .dim { color: var(--dim); }
    .summary { background: var(--panel2); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 12px; padding: 11px 14px; color: var(--text); margin: 6px 0; font-size: 13px; }
    .panel { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
    .scroll { max-height: 420px; overflow-y: auto; }
    .scroll2 { max-height: 520px; overflow-y: auto; }
    .chip { background: var(--panel2); color: var(--dim); border: 1px solid var(--line); border-radius: 99px; padding: 5px 13px; font-size: 11px; cursor: pointer; margin: 2px; font-family: inherit; }
    .chip:hover { color: var(--text); border-color: var(--faint); }
    .chip.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
    .chip.accent:hover { background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .chip.clear { border-color: transparent; }
    input, textarea { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 8px 11px; font-size: 12.5px; outline: none; font-family: inherit; }
    input:focus, textarea:focus { border-color: var(--accent); }
    .w100 { width: 100%; margin-top: 6px; }
    #overview-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    #props { border-left: 1px solid var(--line); padding: 18px 16px; overflow-y: auto; background: var(--panel); display: flex; flex-direction: column; gap: 16px; }
    #props h3 { font-size: 15px; margin-bottom: 10px; }
    #props .prop-block h3 { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--faint); font-family: inherit; font-weight: 600; }
    .prop-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 5px 0; border-bottom: 1px dashed var(--line-soft); font-size: 12px; }
    .prop-row .k { color: var(--faint); }
    .prop-row .v { color: var(--text); font-weight: 500; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #props .evt { display: flex; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--line-soft); font-size: 11.5px; align-items: baseline; }
    #props .evt .t { color: var(--faint); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
    #props .evt .ty { color: var(--accent); font-family: var(--mono); font-size: 10px; white-space: nowrap; }
    #props .evt .msg { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .modal { position: fixed; inset: 0; background: rgba(40, 32, 22, 0.45); display: flex; align-items: center; justify-content: center; z-index: 20; }
    .modal .card { width: 380px; background: var(--panel); }
    @media (max-width: 1180px) { #shell, #shell.no-props { grid-template-columns: 82px 1fr; } #nav button .tx { display: none; } #nav button { justify-content: center; } #sidebar .side-card { display: none; } #props { display: none; } .grid2, .grid3, #overview-grid { grid-template-columns: 1fr; } #company-label { max-width: 18vw; } }
  </style>
</head>
<body>
  <header>
    <span class="logo">PLUTO<span class="dot">.</span></span>
    <select id="company-select" title="switch company"></select>
    <span class="spacer"></span>
    <span class="sub" id="company-label">Autonomous Company OS</span>
    <span class="mono" id="health"></span>
    <span id="live"></span>
    <button id="toggle-chat" title="chat with the company (Ctrl K)">✉</button>
    <button id="toggle-props" title="toggle properties panel">▥</button>
    <button id="new-company" class="chip accent" style="margin:0" title="create a new company">+ company</button>
  </header>
  <div id="shell">
    <aside id="sidebar">
      <button id="new-task" title="new task (Ctrl K)"><span class="ic">✚</span><span class="tx">New Task</span><span class="kbd">⌘K</span></button>
      <nav id="nav"></nav>
      <div class="side-card" id="side-agents-card">
        <h3>Agents <span id="side-agents-count"></span></h3>
        <div id="side-agents"></div>
      </div>
      <div class="side-card" id="side-kpis">
        <h3>Company Health</h3>
        <div id="kpis"></div>
      </div>
    </aside>
    <section id="content">
      <div id="crumbs"></div>
      <div class="card" id="view-command"></div>
      <div id="graph-wrap" class="hidden"><svg id="graph"></svg><div id="graph-legend"></div></div>
      <div id="overview-grid">
        <div class="card">
          <h3>Objective Explorer</h3>
          <div id="obj-tree"></div>
        </div>
        <div class="card">
          <h3>Organization</h3>
          <div id="org-list"></div>
        </div>
      </div>
    </section>
    <aside id="props"></aside>
  </div>
  <aside id="chat" class="closed">
    <div class="chat-head"><h3>Company Chat</h3><span class="dim sub" id="chat-hint">plain-English → real task</span><button id="chat-close" title="close">×</button></div>
    <div id="chat-body"></div>
    <div class="chat-input">
      <input id="chat-text" placeholder="e.g. research 3 new prospects for SEO work" />
      <button id="chat-send" class="chip accent">Send</button>
    </div>
  </aside>
  <div id="cmdbar" class="modal hidden">
    <div class="card cmd-card">
      <h3 style="margin-bottom:2px">New Task</h3>
      <span class="dim sub" style="display:block;margin-bottom:12px">assign work to an agent — it runs for real</span>
      <input id="cmd-summary" class="w100" placeholder="what should they do? e.g. research 3 competitors" />
      <select id="cmd-agent" class="w100" style="margin-top:8px"></select>
      <select id="cmd-objective" class="w100" style="margin-top:8px"></select>
      <select id="cmd-kind" class="w100" style="margin-top:8px"></select>
      <div id="cmd-result" class="dim mono" style="margin-top:10px;min-height:16px;font-size:12px"></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button id="cmd-ok" class="chip accent" style="flex:1">assign &amp; run</button>
        <button id="cmd-cancel" class="chip" style="flex:1">cancel</button>
      </div>
    </div>
  </div>
  <script src="./dist/app.js"></script>
</body>
</html>
